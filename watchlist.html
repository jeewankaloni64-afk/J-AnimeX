<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Watchlist | J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:white;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
padding:45px 6%;
max-width:1000px;
margin:auto;
}

h1{
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.item{
background:#15151f;
border-radius:12px;
overflow:hidden;
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
background:#242432;
}

.info{
padding:15px;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.genre{
color:#999;
font-size:13px;
margin-bottom:15px;
}

button{
background:#ff3b81;
border:0;
color:white;
padding:10px 15px;
border-radius:7px;
cursor:pointer;
font-weight:bold;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.watch{
background:#242432;
text-decoration:none;
color:white;
display:inline-block;
padding:10px 15px;
border-radius:7px;
margin-left:5px;
}

.empty,
.loading,
.error{
color:#999;
text-align:center;
padding:40px 0;
}

.error{
color:#ff6b81;
}

.message{
margin-bottom:20px;
color:#aaa;
}

@media(max-width:600px){

.container{
padding:30px 5%;
}

.grid{
grid-template-columns:
repeat(2,minmax(0,1fr));
gap:12px;
}

.poster{
height:220px;
}

.title{
font-size:15px;
}

.watch,
button{
padding:8px 10px;
font-size:12px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="home"
href="index.html">

← Home

</a>

</header>



<div class="container">


<h1>
❤️ My Watchlist
</h1>


<div
class="message"
id="message">
</div>


<div
class="grid"
id="list">

<div class="loading">
Loading watchlist...
</div>

</div>


</div>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


const list =
document.getElementById("list");

const message =
document.getElementById("message");



/* =========================
   GET CURRENT USER
   ========================= */

async function getCurrentUser(){

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error){

console.error(error);

return null;

}

return data.user || null;

}



/* =========================
   LOAD WATCHLIST
   ========================= */

async function loadWatchlist(){

const user =
await getCurrentUser();


if(!user){

list.innerHTML = `

<div class="empty">

Please login to see your watchlist.

<br><br>

<a
href="login.html"
style="color:#ff3b81">

Go to Login

</a>

</div>

`;

return;

}


const {
data,
error
} =
await supabaseClient
.from("watchlist")
.select(`
id,
anime_id,
created_at,
anime (
id,
title,
genre,
rating,
poster_url
)
`)
.eq(
"user_id",
user.id
)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

list.innerHTML = `

<div class="error">

❌ Watchlist load नहीं हो पाई.

<br>

${escapeHTML(error.message)}

</div>

`;

return;

}


if(!data || data.length === 0){

list.innerHTML =
'<div class="empty">❤️ Your watchlist is empty.</div>';

return;

}


list.innerHTML = "";


data.forEach(item => {

const anime =
item.anime;


if(!anime){

return;

}


const card =
document.createElement("div");

card.className =
"item";


const poster =
document.createElement("img");

poster.className =
"poster";

poster.src =
anime.poster_url || "";

poster.alt =
anime.title || "Anime";


poster.onerror =
function(){

this.style.display =
"none";

};


const info =
document.createElement("div");

info.className =
"info";


const title =
document.createElement("div");

title.className =
"title";

title.textContent =
anime.title || "Untitled";


const genre =
document.createElement("div");

genre.className =
"genre";

genre.textContent =
(anime.genre || "Anime") +
" • ⭐ " +
(anime.rating ?? "N/A");


const removeButton =
document.createElement("button");

removeButton.textContent =
"Remove";

removeButton.onclick =
function(){

removeFromWatchlist(
item.id
);

};


const watchLink =
document.createElement("a");

watchLink.className =
"watch";

watchLink.href =
"anime.html?id=" +
encodeURIComponent(
anime.id
);

watchLink.textContent =
"View";


info.appendChild(title);

info.appendChild(genre);

info.appendChild(removeButton);

info.appendChild(watchLink);

card.appendChild(poster);

card.appendChild(info);

list.appendChild(card);

});

}



/* =========================
   REMOVE FROM WATCHLIST
   ========================= */

async function removeFromWatchlist(
watchlistId
){

const {
error
} =
await supabaseClient
.from("watchlist")
.delete()
.eq(
"id",
watchlistId
);


if(error){

console.error(error);

message.textContent =
"❌ " + error.message;

return;

}


message.textContent =
"✅ Removed from watchlist.";

loadWatchlist();

}



/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
   START
   ========================= */

loadWatchlist();

</script>


</body>

</html>

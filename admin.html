<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>J-AnimeX Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:#fff;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:700px;
margin:auto;
padding:35px 6%;
}

.box{
background:#15151f;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

label{
display:block;
margin:15px 0 7px;
color:#ccc;
}

input,
textarea,
select{
width:100%;
padding:13px;
border:0;
outline:0;
border-radius:8px;
background:#242432;
color:#fff;
font-size:15px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:8px;
background:#ff3b81;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

#loginMessage,
#message,
#episodeMessage{
margin-top:15px;
text-align:center;
line-height:1.5;
}

#adminPanel{
display:none;
}

.logout{
background:#444452;
}

/* =========================
   ANIME LIST
   ========================= */

.anime-item,
.episode-item{
background:#242432;
padding:15px;
border-radius:10px;
margin-top:12px;
overflow:hidden;
}

.anime-item img{
width:80px;
height:110px;
object-fit:cover;
border-radius:8px;
float:left;
margin-right:15px;
background:#111;
}

.anime-item h3,
.episode-item h3{
margin:0 0 8px;
font-size:18px;
}

.info{
color:#bbb;
font-size:14px;
line-height:1.7;
}

.delete-btn{
background:#d62839;
margin-top:12px;
}

.clear{
clear:both;
}

.empty{
text-align:center;
color:#aaa;
padding:20px 0;
}

.divider{
height:1px;
background:#2b2b38;
margin:25px 0;
}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="home"
href="index.html">
← Home
</a>

</header>


<div class="container">


<!-- =========================
     LOGIN
     ========================= -->

<div
class="box"
id="loginBox">

<h2>🔐 Admin Login</h2>

<p>
Login with your Supabase account.
</p>

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="email"
>

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
id="loginButton"
onclick="loginAdmin()">

🔐 Login

</button>

<div
id="loginMessage">
</div>

</div>



<!-- =========================
     ADMIN PANEL
     ========================= -->

<div
class="box"
id="adminPanel">

<h1>🛠️ Admin Panel</h1>

<p>
Manage J-AnimeX anime and episodes.
</p>


<!-- =========================
     ADD ANIME
     ========================= -->

<h2>🎬 Add Anime</h2>

<label>
Anime Title
</label>

<input
id="title"
placeholder="Example: Shadow Warrior X"
>

<label>
Description
</label>

<textarea
id="description"
placeholder="Enter anime description">
</textarea>

<label>
Genre
</label>

<input
id="genre"
placeholder="Action, Adventure, Fantasy"
>

<label>
Rating
</label>

<input
id="rating"
type="number"
step="0.1"
min="0"
max="10"
placeholder="8.5"
>

<label>
Release Year
</label>

<input
id="year"
type="number"
placeholder="2026"
>

<label>
Poster URL
</label>

<input
id="poster"
type="url"
placeholder="https://example.com/poster.jpg"
>

<label>
Legal Content URL
</label>

<input
id="content"
type="url"
placeholder="https://example.com/video.mp4"
>

<button
id="saveButton"
onclick="saveAnime()">

💾 Save Anime

</button>

<div
id="message">
</div>


<div class="divider"></div>


<!-- =========================
     ADD EPISODE
     ========================= -->

<h2>📺 Add Episode</h2>

<label>
Select Anime
</label>

<select id="episodeAnime">

<option value="">
Select Anime
</option>

</select>


<label>
Episode Number
</label>

<input
id="episodeNumber"
type="number"
min="1"
placeholder="1"
>


<label>
Episode Title
</label>

<input
id="episodeTitle"
placeholder="Episode 1"
>


<label>
Legal Video URL
</label>

<input
id="episodeVideo"
type="url"
placeholder="https://example.com/episode1.mp4"
>


<button
id="saveEpisodeButton"
onclick="saveEpisode()">

💾 Save Episode

</button>

<div
id="episodeMessage">
</div>


<button
class="logout"
onclick="logoutAdmin()">

Logout

</button>

</div>



<!-- =========================
     ANIME LIST
     ========================= -->

<div
class="box"
id="animeListBox">

<h2>🎬 Anime List</h2>

<div
id="animeList">

Loading anime...

</div>

</div>



<!-- =========================
     EPISODE LIST
     ========================= -->

<div
class="box"
id="episodeListBox">

<h2>📺 Episode List</h2>

<div
id="episodeList">

Loading episodes...

</div>

</div>


</div>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co/rest/v1/";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   CHECK SESSION
   ========================= */

async function checkSession(){

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();

if(session){

showAdminPanel();

}

}



/* =========================
   LOGIN
   ========================= */

async function loginAdmin(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const loginMessage =
document.getElementById(
"loginMessage"
);

if(!email || !password){

loginMessage.textContent =
"❌ Email और Password भरें।";

return;

}

const button =
document.getElementById(
"loginButton"
);

button.disabled = true;

loginMessage.textContent =
"Logging in...";

const {
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});

if(error){

loginMessage.textContent =
"❌ " + error.message;

button.disabled = false;

return;

}

loginMessage.textContent =
"✅ Login successful!";

showAdminPanel();

button.disabled = false;

}



/* =========================
   SHOW ADMIN
   ========================= */

function showAdminPanel(){

document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"adminPanel"
).style.display =
"block";

loadAnime();
loadAnimeSelect();
loadEpisodes();

}



/* =========================
   LOGOUT
   ========================= */

async function logoutAdmin(){

await supabaseClient
.auth
.signOut();

document.getElementById(
"adminPanel"
).style.display =
"none";

document.getElementById(
"loginBox"
).style.display =
"block";

document.getElementById(
"loginMessage"
).textContent =
"Logged out.";

}



/* =========================
   SAVE ANIME
   ========================= */

async function saveAnime(){

const message =
document.getElementById(
"message"
);

const button =
document.getElementById(
"saveButton"
);

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();

if(!session){

message.textContent =
"❌ Please login first.";

return;

}

const title =
document.getElementById(
"title"
).value.trim();

const description =
document.getElementById(
"description"
).value.trim();

const genre =
document.getElementById(
"genre"
).value.trim();

const rating =
document.getElementById(
"rating"
).value;

const year =
document.getElementById(
"year"
).value;

const poster =
document.getElementById(
"poster"
).value.trim();

const content =
document.getElementById(
"content"
).value.trim();

if(!title){

message.textContent =
"❌ Please enter anime title.";

return;

}

if(!poster){

message.textContent =
"❌ Please enter poster URL.";

return;

}

if(!content){

message.textContent =
"❌ Please enter legal content URL.";

return;

}

button.disabled = true;

message.textContent =
"Saving...";

const {
error
} =
await supabaseClient
.from("anime")
.insert({

title:title,

description:description,

genre:genre,

rating:
rating
? Number(rating)
: null,

release_year:
year
? Number(year)
: null,

poster_url:poster,

content_url:content

});

if(error){

console.error(error);

message.textContent =
"❌ Error: " +
error.message;

button.disabled = false;

return;

}

message.textContent =
"✅ Anime saved!";

document.getElementById(
"title"
).value = "";

document.getElementById(
"description"
).value = "";

document.getElementById(
"genre"
).value = "";

document.getElementById(
"rating"
).value = "";

document.getElementById(
"year"
).value = "";

document.getElementById(
"poster"
).value = "";

document.getElementById(
"content"
).value = "";

button.disabled = false;

loadAnime();
loadAnimeSelect();

}



/* =========================
   LOAD ANIME
   ========================= */

async function loadAnime(){

const list =
document.getElementById(
"animeList"
);

list.innerHTML =
"Loading anime...";

const {
data,
error
} =
await supabaseClient
.from("anime")
.select("*")
.order(
"created_at",
{
ascending:false
}
);

if(error){

console.error(error);

list.innerHTML =
"❌ Anime load नहीं हो पाया: " +
error.message;

return;

}

if(!data || data.length === 0){

list.innerHTML =
'<div class="empty">अभी कोई anime नहीं है।</div>';

return;

}

list.innerHTML = "";

data.forEach(anime => {

const item =
document.createElement(
"div"
);

item.className =
"anime-item";

item.innerHTML = `

<img
src="${escapeHTML(anime.poster_url || "")}"
alt="${escapeHTML(anime.title || "Anime")}"
>

<h3>
${escapeHTML(anime.title || "Untitled")}
</h3>

<div class="info">

Genre:
${escapeHTML(anime.genre || "N/A")}
<br>

Rating:
${anime.rating ?? "N/A"}
<br>

Year:
${anime.release_year ?? "N/A"}

</div>

<button
class="delete-btn"
onclick="deleteAnime('${anime.id}')">

🗑️ Delete

</button>

<div class="clear"></div>

`;

list.appendChild(item);

});

}



/* =========================
   LOAD ANIME SELECT
   ========================= */

async function loadAnimeSelect(){

const select =
document.getElementById(
"episodeAnime"
);

select.innerHTML =
'<option value="">Select Anime</option>';

const {
data,
error
} =
await supabaseClient
.from("anime")
.select("id,title")
.order(
"title",
{
ascending:true
}
);

if(error){

console.error(error);

return;

}

if(!data){

return;

}

data.forEach(anime => {

const option =
document.createElement(
"option"
);

option.value =
anime.id;

option.textContent =
anime.title;

select.appendChild(
option
);

});

}



/* =========================
   SAVE EPISODE
   ========================= */

async function saveEpisode(){

const message =
document.getElementById(
"episodeMessage"
);

const button =
document.getElementById(
"saveEpisodeButton"
);

const animeId =
document.getElementById(
"episodeAnime"
).value;

const episodeNumber =
document.getElementById(
"episodeNumber"
).value;

const title =
document.getElementById(
"episodeTitle"
).value.trim();

const videoUrl =
document.getElementById(
"episodeVideo"
).value.trim();

if(!animeId){

message.textContent =
"❌ Please select an anime.";

return;

}

if(!episodeNumber){

message.textContent =
"❌ Please enter episode number.";

return;

}

if(!title){

message.textContent =
"❌ Please enter episode title.";

return;

}

if(!videoUrl){

message.textContent =
"❌ Please enter legal video URL.";

return;

}

button.disabled = true;

message.textContent =
"Saving episode...";

const {
error
} =
await supabaseClient
.from("episodes")
.insert({

anime_id:animeId,

episode_number:
Number(episodeNumber),

title:title,

video_url:videoUrl

});

if(error){

console.error(error);

message.textContent =
"❌ Error: " +
error.message;

button.disabled = false;

return;

}

message.textContent =
"✅ Episode saved!";

document.getElementById(
"episodeNumber"
).value = "";

document.getElementById(
"episodeTitle"
).value = "";

document.getElementById(
"episodeVideo"
).value = "";

document.getElementById(
"episodeAnime"
).value = "";

button.disabled = false;

loadEpisodes();

}



/* =========================
   LOAD EPISODES
   ========================= */

async function loadEpisodes(){

const list =
document.getElementById(
"episodeList"
);

list.innerHTML =
"Loading episodes...";

const {
data,
error
} =
await supabaseClient
.from("episodes")
.select(`
id,
anime_id,
episode_number,
title,
video_url,
anime (
title
)
`)
.order(
"created_at",
{
ascending:false
}
);

if(error){

console.error(error);

list.innerHTML =
"❌ Episodes load नहीं हो पाए: " +
error.message;

return;

}

if(!data || data.length === 0){

list.innerHTML =
'<div class="empty">अभी कोई episode नहीं है।</div>';

return;

}

list.innerHTML = "";

data.forEach(episode => {

const item =
document.createElement(
"div"
);

item.className =
"episode-item";

const animeTitle =
episode.anime
? episode.anime.title
: "Unknown Anime";

item.innerHTML = `

<h3>
📺 Episode ${episode.episode_number}
</h3>

<div class="info">

Anime:
${escapeHTML(animeTitle)}
<br>

Title:
${escapeHTML(episode.title || "N/A")}

</div>

<button
class="delete-btn"
onclick="deleteEpisode('${episode.id}')">

🗑️ Delete Episode

</button>

`;

list.appendChild(item);

});

}



/* =========================
   DELETE ANIME
   ========================= */

async function deleteAnime(id){

const confirmDelete =
confirm(
"क्या आप यह anime delete करना चाहते हैं? उसके episodes भी delete हो सकते हैं।"
);

if(!confirmDelete){

return;

}

const {
error
} =
await supabaseClient
.from("anime")
.delete()
.eq("id",id);

if(error){

alert(
"❌ Delete failed: " +
error.message
);

return;

}

alert(
"✅ Anime deleted!"
);

loadAnime();
loadAnimeSelect();
loadEpisodes();

}



/* =========================
   DELETE EPISODE
   ========================= */

async function deleteEpisode(id){

const confirmDelete =
confirm(
"क्या आप यह episode delete करना चाहते हैं?"
);

if(!confirmDelete){

return;

}

const {
error
} =
await supabaseClient
.from("episodes")
.delete()
.eq("id",id);

if(error){

alert(
"❌ Delete failed: " +
error.message
);

return;

}

alert(
"✅ Episode deleted!"
);

loadEpisodes();

}



/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
   START
   ========================= */

checkSession();

</script>


</body>

</html>

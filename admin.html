<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin | J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:#fff;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
width:92%;
max-width:1000px;
margin:40px auto;
}

.card{
background:#15151f;
padding:25px;
border-radius:14px;
margin-bottom:25px;
}

h1,
h2{
margin-top:0;
}

label{
display:block;
margin:15px 0 7px;
color:#ccc;
}

input,
textarea,
select{
width:100%;
padding:13px;
border:0;
outline:0;
border-radius:8px;
background:#242432;
color:#fff;
font-size:15px;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:8px;
background:#ff3b81;
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
margin-top:15px;
color:#aaa;
}

.error{
color:#ff6b81;
}

.success{
color:#70e000;
}

.loading{
color:#aaa;
padding:20px 0;
}

.hidden{
display:none;
}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
href="index.html"
class="home">

← Home

</a>

</header>



<div class="container">


<div
class="card"
id="loadingCard">

<div class="loading">
Checking admin access...
</div>

</div>



<div
id="adminPanel"
class="hidden">


<!-- =========================
     ADMIN TITLE
     ========================= -->

<div class="card">

<h1>
⚙️ J-AnimeX Admin Panel
</h1>

<p>
Anime और Episodes manage करें।
</p>

</div>



<!-- =========================
     ADD ANIME
     ========================= -->

<div class="card">

<h2>
🎬 Add Anime
</h2>


<label>
Anime Title
</label>

<input
id="animeTitle"
type="text"
placeholder="Naruto">


<label>
Description
</label>

<textarea
id="animeDescription"
placeholder="Anime description...">
</textarea>


<label>
Genre
</label>

<input
id="animeGenre"
type="text"
placeholder="Action, Adventure">


<label>
Rating
</label>

<input
id="animeRating"
type="number"
step="0.1"
min="0"
max="10"
placeholder="8.5">


<label>
Release Year
</label>

<input
id="animeYear"
type="number"
placeholder="2026">


<label>
Poster URL
</label>

<input
id="animePoster"
type="url"
placeholder="https://example.com/poster.jpg">


<button
id="addAnimeButton"
onclick="addAnime()">

➕ Add Anime

</button>


<div
class="message"
id="animeMessage">
</div>

</div>



<!-- =========================
     ADD EPISODE
     ========================= -->

<div class="card">

<h2>
📺 Add Episode
</h2>


<label>
Select Anime
</label>

<select
id="episodeAnime">

<option value="">
Loading anime...
</option>

</select>


<label>
Episode Number
</label>

<input
id="episodeNumber"
type="number"
min="1"
placeholder="1">


<label>
Episode Title
</label>

<input
id="episodeTitle"
type="text"
placeholder="Episode 1">


<label>
Video URL
</label>

<input
id="episodeVideo"
type="url"
placeholder="https://example.com/video.mp4">


<button
id="addEpisodeButton"
onclick="addEpisode()">

➕ Add Episode

</button>


<div
class="message"
id="episodeMessage">
</div>

</div>



</div>


</div>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   CHECK ADMIN
   ========================= */

async function checkAdmin(){

const loadingCard =
document.getElementById(
"loadingCard"
);

const panel =
document.getElementById(
"adminPanel"
);


const {
data:{
user
}
} =
await supabaseClient
.auth
.getUser();


if(!user){

loadingCard.innerHTML = `

<div class="error">

❌ Please login first.

<br><br>

<a
href="login.html"
style="color:#ff3b81">

Go to Login

</a>

</div>

`;

return;

}


const {
data:profile,
error
} =
await supabaseClient
.from("Profiles")
.select("role")
.eq("id",user.id)
.maybeSingle();


if(error){

console.error(error);

loadingCard.innerHTML = `

<div class="error">

❌ Profile check failed.

<br>

${escapeHTML(
error.message
)}

</div>

`;

return;

}


if(!profile || profile.role !== "admin"){

loadingCard.innerHTML = `

<div class="error">

❌ Access denied.

<br><br>

Admin access required.

</div>

`;

return;

}


loadingCard.classList.add(
"hidden"
);

panel.classList.remove(
"hidden"
);


loadAnimeOptions();

}



/* =========================
   LOAD ANIME OPTIONS
   ========================= */

async function loadAnimeOptions(){

const select =
document.getElementById(
"episodeAnime"
);


const {
data,
error
} =
await supabaseClient
.from("anime")
.select("id,title")
.order(
"title",
{
ascending:true
}
);


if(error){

console.error(error);

select.innerHTML =
'<option value="">Failed to load anime</option>';

return;

}


if(!data || data.length === 0){

select.innerHTML =
'<option value="">No anime available</option>';

return;

}


select.innerHTML =
'<option value="">Select anime</option>';


data.forEach(anime => {

const option =
document.createElement(
"option"
);

option.value =
anime.id;

option.textContent =
anime.title;

select.appendChild(
option
);

});

}



/* =========================
   ADD ANIME
   ========================= */

async function addAnime(){

const title =
document.getElementById(
"animeTitle"
).value.trim();

const description =
document.getElementById(
"animeDescription"
).value.trim();

const genre =
document.getElementById(
"animeGenre"
).value.trim();

const ratingValue =
document.getElementById(
"animeRating"
).value;

const yearValue =
document.getElementById(
"animeYear"
).value;

const poster =
document.getElementById(
"animePoster"
).value.trim();


const message =
document.getElementById(
"animeMessage"
);

const button =
document.getElementById(
"addAnimeButton"
);


if(!title){

message.className =
"message error";

message.textContent =
"Anime title required.";

return;

}


button.disabled =
true;

message.className =
"message";

message.textContent =
"Adding anime...";


const {
error
} =
await supabaseClient
.from("anime")
.insert({

title:title,

description:
description || null,

genre:
genre || null,

rating:
ratingValue
? Number(ratingValue)
: null,

release_year:
yearValue
? Number(yearValue)
: null,

poster_url:
poster || null

});


if(error){

console.error(error);

message.className =
"message error";

message.textContent =
"❌ " + error.message;

button.disabled =
false;

return;

}


message.className =
"message success";

message.textContent =
"✅ Anime added successfully!";


document.getElementById(
"animeTitle"
).value = "";

document.getElementById(
"animeDescription"
).value = "";

document.getElementById(
"animeGenre"
).value = "";

document.getElementById(
"animeRating"
).value = "";

document.getElementById(
"animeYear"
).value = "";

document.getElementById(
"animePoster"
).value = "";


button.disabled =
false;


loadAnimeOptions();

}



/* =========================
   ADD EPISODE
   ========================= */

async function addEpisode(){

const animeId =
document.getElementById(
"episodeAnime"
).value;

const episodeNumber =
document.getElementById(
"episodeNumber"
).value;

const title =
document.getElementById(
"episodeTitle"
).value.trim();

const videoUrl =
document.getElementById(
"episodeVideo"
).value.trim();


const message =
document.getElementById(
"episodeMessage"
);

const button =
document.getElementById(
"addEpisodeButton"
);


if(!animeId){

message.className =
"message error";

message.textContent =
"Please select anime.";

return;

}


if(!episodeNumber){

message.className =
"message error";

message.textContent =
"Episode number required.";

return;

}


if(!videoUrl){

message.className =
"message error";

message.textContent =
"Video URL required.";

return;

}


button.disabled =
true;

message.className =
"message";

message.textContent =
"Adding episode...";


const {
error
} =
await supabaseClient
.from("episodes")
.insert({

anime_id:
animeId,

episode_number:
Number(episodeNumber),

title:
title || null,

video_url:
videoUrl

});


if(error){

console.error(error);

message.className =
"message error";

message.textContent =
"❌ " + error.message;

button.disabled =
false;

return;

}


message.className =
"message success";

message.textContent =
"✅ Episode added successfully!";


document.getElementById(
"episodeNumber"
).value = "";

document.getElementById(
"episodeTitle"
).value = "";

document.getElementById(
"episodeVideo"
).value = "";


button.disabled =
false;

}



/* =========================
   ESCAPE HTML
   ========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
   START
   ========================= */

checkAdmin();

</script>


</body>

</html>

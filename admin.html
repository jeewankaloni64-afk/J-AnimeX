<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>J-AnimeX Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:#fff;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:700px;
margin:auto;
padding:35px 6%;
}

.box{
background:#15151f;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

h1,h2{
margin-top:0;
}

label{
display:block;
margin:15px 0 7px;
color:#ccc;
}

input,
textarea{
width:100%;
padding:13px;
border:0;
outline:0;
border-radius:8px;
background:#242432;
color:#fff;
font-size:15px;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:8px;
background:#ff3b81;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

#loginMessage,
#message{
margin-top:15px;
text-align:center;
line-height:1.5;
}

#adminPanel{
display:none;
}

.logout{
background:#444452;
}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="home"
href="index.html">
← Home
</a>

</header>


<div class="container">


<!-- LOGIN -->

<div
class="box"
id="loginBox">

<h2>🔐 Admin Login</h2>

<p>
Login with your Supabase account.
</p>


<label>
Email
</label>

<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="email"
>


<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>


<button
id="loginButton"
onclick="loginAdmin()">

🔐 Login

</button>


<div
id="loginMessage">
</div>

</div>



<!-- ADMIN PANEL -->

<div
class="box"
id="adminPanel">

<h1>🛠️ Admin Panel</h1>

<p>
Add anime to J-AnimeX.
</p>


<label>
Anime Title
</label>

<input
id="title"
placeholder="Example: Shadow Warrior X"
>


<label>
Description
</label>

<textarea
id="description"
placeholder="Enter anime description">
</textarea>


<label>
Genre
</label>

<input
id="genre"
placeholder="Action, Adventure, Fantasy"
>


<label>
Rating
</label>

<input
id="rating"
type="number"
step="0.1"
min="0"
max="10"
placeholder="8.5"
>


<label>
Release Year
</label>

<input
id="year"
type="number"
placeholder="2026"
>


<label>
Poster URL
</label>

<input
id="poster"
type="url"
placeholder="https://example.com/poster.jpg"
>


<label>
Legal Content URL
</label>

<input
id="content"
type="url"
placeholder="https://example.com/video.mp4"
>


<button
id="saveButton"
onclick="saveAnime()">

💾 Save Anime

</button>


<button
class="logout"
onclick="logoutAdmin()">

Logout

</button>


<div
id="message">
</div>

</div>


</div>


<script>


/* =========================
   SUPABASE
   ========================= */


const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   CHECK LOGIN
   ========================= */


async function checkSession(){

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();


if(session){

showAdminPanel();

}

}



/* =========================
   LOGIN
   ========================= */


async function loginAdmin(){

const email =
document.getElementById(
"email"
).value.trim();


const password =
document.getElementById(
"password"
).value;


const loginMessage =
document.getElementById(
"loginMessage"
);


if(!email || !password){

loginMessage.textContent =
"❌ Email और Password भरें।";

return;

}


const button =
document.getElementById(
"loginButton"
);


button.disabled = true;

loginMessage.textContent =
"Logging in...";


const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

loginMessage.textContent =
"❌ " + error.message;

button.disabled = false;

return;

}


loginMessage.textContent =
"✅ Login successful!";


showAdminPanel();


button.disabled = false;

}



/* =========================
   SHOW ADMIN
   ========================= */


function showAdminPanel(){

document.getElementById(
"loginBox"
).style.display =
"none";


document.getElementById(
"adminPanel"
).style.display =
"block";

}



/* =========================
   LOGOUT
   ========================= */


async function logoutAdmin(){

await supabaseClient
.auth
.signOut();


document.getElementById(
"adminPanel"
).style.display =
"none";


document.getElementById(
"loginBox"
).style.display =
"block";


document.getElementById(
"loginMessage"
).textContent =
"Logged out.";

}



/* =========================
   SAVE ANIME
   ========================= */


async function saveAnime(){

const message =
document.getElementById(
"message"
);


const button =
document.getElementById(
"saveButton"
);


const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();


if(!session){

message.textContent =
"❌ Please login first.";

return;

}


const title =
document.getElementById(
"title"
).value.trim();


const description =
document.getElementById(
"description"
).value.trim();


const genre =
document.getElementById(
"genre"
).value.trim();


const rating =
document.getElementById(
"rating"
).value;


const year =
document.getElementById(
"year"
).value;


const poster =
document.getElementById(
"poster"
).value.trim();


const content =
document.getElementById(
"content"
).value.trim();



if(!title){

message.textContent =
"❌ Please enter anime title.";

return;

}


if(!poster){

message.textContent =
"❌ Please enter poster URL.";

return;

}


if(!content){

message.textContent =
"❌ Please enter legal content URL.";

return;

}


button.disabled = true;

message.textContent =
"Saving...";


const {
error
} =
await supabaseClient
.from("anime")
.insert({

title:title,

description:description,

genre:genre,

rating:
rating
? Number(rating)
: null,

release_year:
year
? Number(year)
: null,

poster_url:poster,

content_url:content

});


if(error){

console.error(error);

message.textContent =
"❌ Error: " +
error.message;

button.disabled = false;

return;

}


message.textContent =
"✅ Anime saved to Supabase!";


document.getElementById(
"title"
).value = "";


document.getElementById(
"description"
).value = "";


document.getElementById(
"genre"
).value = "";


document.getElementById(
"rating"
).value = "";


document.getElementById(
"year"
).value = "";


document.getElementById(
"poster"
).value = "";


document.getElementById(
"content"
).value = "";


button.disabled = false;

}



/* =========================
   START
   ========================= */


checkSession();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | J-AnimeX</title>

<style>
body{
  margin:0;
  background:#09090f;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  width:90%;
  max-width:400px;
  margin:80px auto;
  padding:30px;
  background:#15151f;
  border-radius:15px;
}

h1{
  text-align:center;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

.logo span{
  color:#ff3b81;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  box-sizing:border-box;
  border:0;
  border-radius:8px;
  background:#242432;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  background:#ff3b81;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#message{
  text-align:center;
  margin-top:15px;
  color:#bbb;
}

.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#ff3b81;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
J-<span>AnimeX</span>
</div>

<h1>Login / Register</h1>

<input
  id="email"
  type="email"
  placeholder="Email"
>

<input
  id="password"
  type="password"
  placeholder="Password"
>

<button onclick="login()">
Login
</button>

<button onclick="signup()">
Create Account
</button>

<div id="message"></div>

<a class="home" href="index.html">
← Back to J-AnimeX
</a>

</div>

<script>

function login(){

document.getElementById("message").innerText =
"Supabase connection will be added in the next step.";

}

function signup(){

document.getElementById("message").innerText =
"Supabase connection will be added in the next step.";

}

</script>

</body>
</html>

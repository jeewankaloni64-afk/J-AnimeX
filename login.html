<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | J-AnimeX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

.container{
width:92%;
max-width:420px;
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
margin-bottom:25px;
}

.logo span{
color:#ff3b81;
}

.box{
background:#15151f;
padding:30px;
border-radius:16px;
}

h1{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
margin:15px 0 7px;
color:#ccc;
}

input{
width:100%;
padding:14px;
border:0;
outline:0;
border-radius:8px;
background:#242432;
color:white;
font-size:15px;
}

input:focus{
outline:2px solid #ff3b81;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:8px;
background:#ff3b81;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.secondary{
background:#242432;
}

#message{
text-align:center;
margin-top:18px;
color:#bbb;
min-height:20px;
}

.home{
display:block;
text-align:center;
margin-top:20px;
color:#ff3b81;
text-decoration:none;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">

J-<span>AnimeX</span>

</div>


<div class="box">


<h1>👤 Account</h1>


<label>
Email
</label>


<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
>


<label>
Password
</label>


<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
>


<button
id="loginButton"
onclick="loginUser()">

Login

</button>


<button
id="registerButton"
class="secondary"
onclick="registerUser()">

Create Account

</button>


<div id="message"></div>


<a
class="home"
href="index.html">

← Back to J-AnimeX

</a>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   MESSAGE
   ========================= */

function showMessage(text){

document.getElementById(
"message"
).textContent = text;

}



/* =========================
   LOGIN
   ========================= */

async function loginUser(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(!email || !password){

showMessage(
"Please enter email and password."
);

return;

}


const button =
document.getElementById(
"loginButton"
);

button.disabled = true;

showMessage(
"Logging in..."
);


const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if(error){

console.error(error);

showMessage(
"❌ " + error.message
);

button.disabled = false;

return;

}


showMessage(
"✅ Login successful!"
);


setTimeout(() => {

window.location.href =
"index.html";

},700);

}



/* =========================
   REGISTER
   ========================= */

async function registerUser(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(!email || !password){

showMessage(
"Please enter email and password."
);

return;

}


if(password.length < 6){

showMessage(
"Password must be at least 6 characters."
);

return;

}


const button =
document.getElementById(
"registerButton"
);

button.disabled = true;

showMessage(
"Creating account..."
);


const {
data,
error
} =
await supabaseClient.auth.signUp({

email: email,

password: password

});


if(error){

console.error(error);

showMessage(
"❌ " + error.message
);

button.disabled = false;

return;

}


/*
  Supabase may require email confirmation.
*/

if(
data.user &&
!data.session
){

showMessage(
"✅ Account created! Please check your email to confirm your account."
);

button.disabled = false;

return;

}


showMessage(
"✅ Account created successfully!"
);


setTimeout(() => {

window.location.href =
"index.html";

},700);

}


</script>


</body>

</html>

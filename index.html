<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
background:#09090f;
color:#fff;
font-family:Arial,sans-serif;
}

header{
position:sticky;
top:0;
z-index:1000;
padding:16px 6%;
background:rgba(17,17,26,.96);
border-bottom:1px solid #252532;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
white-space:nowrap;
}

.logo span{
color:#ff3b81;
}

.nav{
display:flex;
align-items:center;
gap:8px;
}

.nav a{
color:#fff;
text-decoration:none;
background:#242432;
padding:10px 14px;
border-radius:7px;
transition:.2s;
}

.nav a:hover{
background:#333344;
}

.nav .watchlist{
background:#ff3b81;
}

.menu{
display:none;
border:0;
background:#242432;
color:#fff;
font-size:22px;
padding:8px 12px;
border-radius:7px;
cursor:pointer;
}

.hero{
padding:80px 6%;
background:
linear-gradient(
135deg,
#17101f,
#0d0d15
);
}

.hero h1{
font-size:clamp(35px,6vw,55px);
margin:0 0 15px;
}

.hero span{
color:#ff3b81;
}

.hero p{
color:#aaa;
font-size:18px;
margin:0;
}

section{
padding:45px 6%;
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.section-title h2{
margin:0;
}

.search-box{
margin-top:20px;
}

.search{
width:100%;
max-width:650px;
padding:15px 18px;
border:1px solid #292936;
outline:0;
border-radius:10px;
background:#1b1b26;
color:#fff;
font-size:15px;
}

.search:focus{
border-color:#ff3b81;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(170px,1fr));
gap:20px;
margin-top:25px;
}

.card{
background:#15151f;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s;
border:1px solid transparent;
}

.card:hover{
transform:translateY(-5px);
border-color:#ff3b81;
}

.poster{
width:100%;
height:230px;
object-fit:cover;
display:block;
background:#292936;
}

.info{
padding:15px;
}

.info h3{
margin:0 0 8px;
font-size:17px;
}

.rating{
color:#ffd166;
}

.genre{
color:#999;
font-size:13px;
margin-top:6px;
}

.category{
display:inline-block;
background:#20202c;
padding:10px 16px;
border-radius:20px;
margin:5px;
cursor:pointer;
transition:.2s;
}

.category:hover{
background:#ff3b81;
}

.loading,
.empty,
.error{
color:#aaa;
padding:25px 0;
text-align:center;
}

.error{
color:#ff6b81;
}

footer{
text-align:center;
padding:30px;
background:#11111a;
color:#888;
margin-top:20px;
}

@media(max-width:700px){

header{
padding:14px 5%;
}

.logo{
font-size:24px;
}

.menu{
display:block;
}

.nav{
display:none;
position:absolute;
top:65px;
left:0;
right:0;
padding:15px 5%;
background:#11111a;
border-bottom:1px solid #252532;
flex-direction:column;
align-items:stretch;
}

.nav.active{
display:flex;
}

.nav a{
text-align:center;
}

.hero{
padding:60px 5%;
}

section{
padding:35px 5%;
}

.grid{
grid-template-columns:
repeat(2,minmax(0,1fr));
gap:12px;
}

.poster{
height:220px;
}

.info{
padding:12px;
}

.info h3{
font-size:15px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>


<button
class="menu"
onclick="toggleMenu()"
aria-label="Menu">

☰

</button>


<nav
class="nav"
id="nav">

<a href="index.html">
🏠 Home
</a>

<a href="#anime">
🎬 Anime
</a>

<a href="#categories">
🎭 Categories
</a>

<a href="watchlist.html"
class="watchlist">

❤️ Watchlist

</a>

<a href="login.html">
👤 Login
</a>

</nav>

</header>



<div class="hero">

<h1>
Welcome to <span>J-AnimeX</span>
</h1>

<p>
Discover your next anime adventure.
</p>

</div>



<section id="anime">

<div class="section-title">

<h2>
🔥 Anime
</h2>

</div>


<div class="search-box">

<input
class="search"
id="search"
placeholder="🔎 Search anime..."
oninput="searchAnime()"
autocomplete="off">

</div>


<div
class="grid"
id="animeGrid">

<div class="loading">
Loading anime...
</div>

</div>

</section>



<section id="categories">

<div class="section-title">

<h2>
🎭 Categories
</h2>

</div>


<span
class="category"
onclick="filterGenre('Action')">

Action

</span>


<span
class="category"
onclick="filterGenre('Adventure')">

Adventure

</span>


<span
class="category"
onclick="filterGenre('Fantasy')">

Fantasy

</span>


<span
class="category"
onclick="filterGenre('Romance')">

Romance

</span>


<span
class="category"
onclick="filterGenre('Comedy')">

Comedy

</span>


<span
class="category"
onclick="filterGenre('Sci-Fi')">

Sci-Fi

</span>


<span
class="category"
onclick="showAllAnime()">

All

</span>

</section>



<footer>

© 2026 J-AnimeX

</footer>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let allAnime = [];



/* =========================
   MOBILE MENU
   ========================= */

function toggleMenu(){

const nav =
document.getElementById("nav");

nav.classList.toggle("active");

}



/* =========================
   LOAD ANIME
   ========================= */

async function loadAnime(){

const grid =
document.getElementById("animeGrid");

grid.innerHTML =
'<div class="loading">Loading anime...</div>';


const {
data,
error
} =
await supabaseClient
.from("anime")
.select(`
id,
title,
description,
genre,
rating,
release_year,
poster_url
`)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

grid.innerHTML =
'<div class="error">❌ Anime load नहीं हो पाया.</div>';

return;

}


allAnime =
data || [];

renderAnime(allAnime);

}



/* =========================
   RENDER ANIME
   ========================= */

function renderAnime(animeList){

const grid =
document.getElementById("animeGrid");


if(!animeList.length){

grid.innerHTML =
'<div class="empty">कोई anime नहीं मिला।</div>';

return;

}


grid.innerHTML = "";


animeList.forEach(anime => {

const card =
document.createElement("div");

card.className =
"card";


card.onclick =
function(){

openAnime(anime.id);

};


const poster =
document.createElement("img");

poster.className =
"poster";

poster.src =
anime.poster_url || "";

poster.alt =
anime.title || "Anime";


poster.onerror =
function(){

this.src =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(
"<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500'>" +
"<rect width='100%' height='100%' fill='#292936'/>" +
"<text x='50%' y='50%' fill='white' font-size='24' text-anchor='middle'>No Poster</text>" +
"</svg>"
);

};


const info =
document.createElement("div");

info.className =
"info";


const title =
document.createElement("h3");

title.textContent =
anime.title || "Untitled";


const rating =
document.createElement("div");

rating.className =
"rating";

rating.textContent =
"⭐ " +
(anime.rating ?? "N/A");


const genre =
document.createElement("div");

genre.className =
"genre";

genre.textContent =
anime.genre || "Unknown";


info.appendChild(title);

info.appendChild(rating);

info.appendChild(genre);

card.appendChild(poster);

card.appendChild(info);

grid.appendChild(card);

});

}



/* =========================
   SEARCH
   ========================= */

function searchAnime(){

const input =
document.getElementById("search")
.value
.toLowerCase()
.trim();


if(!input){

renderAnime(allAnime);

return;

}


const filtered =
allAnime.filter(
anime => {

const title =
(anime.title || "")
.toLowerCase();

const genre =
(anime.genre || "")
.toLowerCase();

return (
title.includes(input) ||
genre.includes(input)
);

});


renderAnime(filtered);

}



/* =========================
   FILTER GENRE
   ========================= */

function filterGenre(genre){

const filtered =
allAnime.filter(
anime => {

return (
anime.genre || ""
)
.toLowerCase()
.includes(
genre.toLowerCase()
);

});

renderAnime(filtered);

document.getElementById(
"anime"
).scrollIntoView({
behavior:"smooth"
});

}



/* =========================
   SHOW ALL
   ========================= */

function showAllAnime(){

renderAnime(allAnime);

document.getElementById(
"anime"
).scrollIntoView({
behavior:"smooth"
});

}



/* =========================
   OPEN ANIME
   ========================= */

function openAnime(id){

window.location.href =
"anime.html?id=" +
encodeURIComponent(id);

}



/* =========================
   CLOSE MOBILE MENU
   ========================= */

document.querySelectorAll(
".nav a"
).forEach(link => {

link.addEventListener(
"click",
function(){

document
.getElementById("nav")
.classList.remove("active");

});

});



/* =========================
   START
   ========================= */

loadAnime();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.nav{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.nav a{
color:#fff;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:7px;
}

.nav .watchlist{
background:#ff3b81;
}

.hero{
padding:70px 6%;
background:#17101f;
}

.hero h1{
font-size:50px;
margin:0 0 15px;
}

.hero span{
color:#ff3b81;
}

section{
padding:40px 6%;
}

.search{
width:90%;
max-width:600px;
padding:15px;
border:0;
outline:0;
border-radius:8px;
background:#1b1b26;
color:#fff;
font-size:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(170px,1fr)
);
gap:20px;
margin-top:25px;
}

.card{
background:#15151f;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-5px);
}

.poster{
width:100%;
height:230px;
object-fit:cover;
display:block;
background:#292936;
}

.info{
padding:15px;
}

.info h3{
margin:0 0 8px;
}

.rating{
color:#ffd166;
}

.genre{
color:#999;
font-size:13px;
margin-top:6px;
}

.category{
display:inline-block;
background:#20202c;
padding:10px 16px;
border-radius:20px;
margin:5px;
cursor:pointer;
}

.loading,
.empty,
.error{
color:#aaa;
padding:25px 0;
}

.error{
color:#ff6b81;
}

footer{
text-align:center;
padding:30px;
background:#11111a;
color:#888;
}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<div class="nav">

<a href="login.html">
👤 Login
</a>

<a
href="watchlist.html"
class="watchlist">

❤️ Watchlist

</a>

</div>

</header>



<div class="hero">

<h1>
Welcome to <span>J-AnimeX</span>
</h1>

<p>
Discover your next anime adventure.
</p>

</div>



<section>

<h2>🔎 Search Anime</h2>

<input
class="search"
id="search"
placeholder="Search anime..."
oninput="searchAnime()"
>

</section>



<section>

<h2>🔥 Anime</h2>

<div
class="grid"
id="animeGrid">

<div class="loading">
Loading anime...
</div>

</div>

</section>



<section>

<h2>🎭 Categories</h2>

<span
class="category"
onclick="filterGenre('Action')">

Action

</span>

<span
class="category"
onclick="filterGenre('Adventure')">

Adventure

</span>

<span
class="category"
onclick="filterGenre('Fantasy')">

Fantasy

</span>

<span
class="category"
onclick="filterGenre('Romance')">

Romance

</span>

<span
class="category"
onclick="filterGenre('Comedy')">

Comedy

</span>

<span
class="category"
onclick="filterGenre('Sci-Fi')">

Sci-Fi

</span>

</section>



<footer>

© 2026 J-AnimeX

</footer>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co/rest/v1/";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



let allAnime = [];



/* =========================
   LOAD ANIME
   ========================= */

async function loadAnime(){

const grid =
document.getElementById(
"animeGrid"
);

grid.innerHTML =
'<div class="loading">Loading anime...</div>';


const {
data,
error
} =
await supabaseClient
.from("anime")
.select(`
id,
title,
description,
genre,
rating,
release_year,
poster_url
`)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

grid.innerHTML =
'<div class="error">❌ Anime load नहीं हो पाया.</div>';

return;

}


allAnime =
data || [];

renderAnime(allAnime);

}



/* =========================
   RENDER ANIME
   ========================= */

function renderAnime(animeList){

const grid =
document.getElementById(
"animeGrid"
);

if(!animeList.length){

grid.innerHTML =
'<div class="empty">कोई anime नहीं मिला।</div>';

return;

}


grid.innerHTML = "";


animeList.forEach(anime => {

const card =
document.createElement(
"div"
);

card.className =
"card";


card.onclick =
function(){

openAnime(anime.id);

};



const poster =
document.createElement(
"img"
);

poster.className =
"poster";

poster.src =
anime.poster_url || "";

poster.alt =
anime.title || "Anime";


const info =
document.createElement(
"div"
);

info.className =
"info";


const title =
document.createElement(
"h3"
);

title.textContent =
anime.title || "Untitled";


const rating =
document.createElement(
"div"
);

rating.className =
"rating";

rating.textContent =
"⭐ " +
(anime.rating ?? "N/A");


const genre =
document.createElement(
"div"
);

genre.className =
"genre";

genre.textContent =
anime.genre || "Unknown";


info.appendChild(
title
);

info.appendChild(
rating
);

info.appendChild(
genre
);

card.appendChild(
poster
);

card.appendChild(
info
);

grid.appendChild(
card
);

});

}



/* =========================
   SEARCH
   ========================= */

function searchAnime(){

const input =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


if(!input){

renderAnime(
allAnime
);

return;

}


const filtered =
allAnime.filter(
anime => {

const title =
(anime.title || "")
.toLowerCase();

const genre =
(anime.genre || "")
.toLowerCase();

return (
title.includes(input) ||
genre.includes(input)
);

});


renderAnime(
filtered
);

}



/* =========================
   FILTER GENRE
   ========================= */

function filterGenre(
genre
){

const filtered =
allAnime.filter(
anime => {

return (
anime.genre || ""
)
.toLowerCase()
.includes(
genre.toLowerCase()
);

});

renderAnime(
filtered
);

}



/* =========================
   OPEN ANIME
   ========================= */

function openAnime(
id
){

window.location.href =
"anime.html?id=" +
encodeURIComponent(id);

}



/* =========================
   START
   ========================= */

loadAnime();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watch | J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.back{
color:white;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:1000px;
margin:auto;
padding:35px 6%;
}

.video-box{
background:#000;
border-radius:14px;
overflow:hidden;
}

video{
width:100%;
display:block;
max-height:600px;
background:#000;
}

h1{
margin-top:25px;
font-size:35px;
}

.episode-title{
color:#ff3b81;
font-size:18px;
margin:10px 0;
}

.description{
color:#aaa;
line-height:1.8;
}

.btn{
display:inline-block;
padding:12px 18px;
margin-top:15px;
margin-right:8px;
border:0;
border-radius:8px;
background:#ff3b81;
color:white;
text-decoration:none;
cursor:pointer;
font-weight:bold;
}

.secondary{
background:#242432;
}

.message{
margin-top:20px;
color:#aaa;
}

.error{
color:#ff6b81;
}

.loading{
color:#aaa;
padding:30px 0;
}

.note{
margin-top:25px;
padding:18px;
background:#15151f;
border-radius:10px;
color:#aaa;
line-height:1.6;
}

.episodes{
margin-top:35px;
}

.episodes h2{
margin-bottom:15px;
}

.episode-list{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.episode-btn{
background:#242432;
color:white;
border:0;
padding:10px 15px;
border-radius:7px;
cursor:pointer;
}

.episode-btn.active{
background:#ff3b81;
}

.hidden{
display:none;
}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="back"
href="index.html">

← Home

</a>

</header>



<main class="container">


<div
class="loading"
id="loading">

Loading episode...

</div>



<div
id="content"
class="hidden">


<div class="video-box">

<video
id="video"
controls
playsinline>

Your browser does not support
video playback.

</video>

</div>


<h1
id="title">
</h1>


<div
class="episode-title"
id="episodeTitle">
</div>


<p
class="description"
id="description">
</p>


<a
class="btn secondary"
id="animeButton"
href="#">

← Anime Details

</a>


<button
class="btn"
id="watchlistButton"
onclick="addWatchlist()">

❤️ Add to Watchlist

</button>


<div
class="message"
id="message">
</div>



<div class="episodes">

<h2>
📺 Episodes
</h2>


<div
class="episode-list"
id="episodeList">

</div>

</div>



<div class="note">

<strong>Important:</strong>

This player is intended only for
original, licensed, or legally
permitted video content.

</div>


</div>


</main>



<script>


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* =========================
   URL PARAMETERS
   ========================= */

const params =
new URLSearchParams(
window.location.search
);


const animeId =
params.get("id");


const episodeId =
params.get("episode");



/* =========================
   ELEMENTS
   ========================= */

const loading =
document.getElementById(
"loading"
);

const content =
document.getElementById(
"content"
);

const video =
document.getElementById(
"video"
);

const title =
document.getElementById(
"title"
);

const episodeTitle =
document.getElementById(
"episodeTitle"
);

const description =
document.getElementById(
"description"
);

const animeButton =
document.getElementById(
"animeButton"
);

const message =
document.getElementById(
"message"
);

const episodeList =
document.getElementById(
"episodeList"
);

const watchlistButton =
document.getElementById(
"watchlistButton"
);



let currentAnimeId =
null;



/* =========================
   LOAD WATCH PAGE
   ========================= */

async function loadWatchPage(){

if(!animeId){

loading.innerHTML =
'<div class="error">❌ Anime ID नहीं मिला.</div>';

return;

}


const {
data:anime,
error
} =
await supabaseClient
.from("anime")
.select(`
id,
title,
description,
poster_url
`)
.eq(
"id",
animeId
)
.maybeSingle();


if(error){

console.error(error);

loading.innerHTML =
'<div class="error">❌ Anime load नहीं हो पाया.</div>';

return;

}


if(!anime){

loading.innerHTML =
'<div class="error">❌ Anime नहीं मिला.</div>';

return;

}


currentAnimeId =
anime.id;


title.textContent =
anime.title || "Anime";


description.textContent =
anime.description ||
"Information coming soon.";


animeButton.href =
"anime.html?id=" +
encodeURIComponent(
anime.id
);


if(anime.poster_url){

video.poster =
anime.poster_url;

}


await loadEpisodes(
anime
);

}



/* =========================
   LOAD EPISODES
   ========================= */

async function loadEpisodes(
anime
){

const {
data:episodes,
error
} =
await supabaseClient
.from("episodes")
.select(`
id,
episode_number,
title,
video_url,
created_at
`)
.eq(
"anime_id",
anime.id
)
.order(
"episode_number",
{
ascending:true
}
);


if(error){

console.error(error);

loading.innerHTML =
'<div class="error">❌ Episodes load नहीं हो पाए.</div>';

return;

}


if(!episodes ||
episodes.length === 0){

loading.innerHTML =
'<div class="error">❌ इस anime का कोई episode नहीं है.</div>';

return;

}


renderEpisodes(
episodes
);


let selectedEpisode =
null;


if(episodeId){

selectedEpisode =
episodes.find(
episode =>
String(episode.id) ===
String(episodeId)
);

}


if(!selectedEpisode){

selectedEpisode =
episodes[0];

}


playEpisode(
selectedEpisode,
anime
);


loading.style.display =
"none";

content.classList.remove(
"hidden"
);

}



/* =========================
   RENDER EPISODES
   ========================= */

function renderEpisodes(
episodes
){

episodeList.innerHTML =
"";


episodes.forEach(
episode => {

const button =
document.createElement(
"button"
);

button.className =
"episode-btn";


button.textContent =
"Episode " +
episode.episode_number;


button.onclick =
function(){

playEpisode(
episode,
null
);

};


button.dataset.id =
episode.id;


episodeList.appendChild(
button
);

});

}



/* =========================
   PLAY EPISODE
   ========================= */

function playEpisode(
episode,
anime
){

if(!episode){

return;

}


if(!episode.video_url){

message.textContent =
"❌ इस episode का video URL उपलब्ध नहीं है.";

return;

}


video.src =
episode.video_url;


video.load();


episodeTitle.textContent =
"Episode " +
episode.episode_number +
(
episode.title
? " • " + episode.title
: ""
);


document
.querySelectorAll(
".episode-btn"
)
.forEach(
button => {

button.classList.toggle(
"active",
String(button.dataset.id) ===
String(episode.id)
);

});


message.textContent =
"";


const newUrl =
"watch.html?id=" +
encodeURIComponent(
currentAnimeId
) +
"&episode=" +
encodeURIComponent(
episode.id
);


window.history.replaceState(
{},
"",
newUrl
);

}



/* =========================
   GET CURRENT USER
   ========================= */

async function getCurrentUser(){

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error){

console.error(error);

return null;

}


return data.user || null;

}



/* =========================
   ADD WATCHLIST
   ========================= */

async function addWatchlist(){

if(!currentAnimeId){

return;

}


const user =
await getCurrentUser();


if(!user){

message.textContent =
"❌ Please login first.";

setTimeout(
function(){

window.location.href =
"login.html";

},
800
);

return;

}


watchlistButton.disabled =
true;


const {
data:existing,
error:checkError
} =
await supabaseClient
.from("watchlist")
.select("id")
.eq(
"user_id",
user.id
)
.eq(
"anime_id",
currentAnimeId
)
.maybeSingle();


if(checkError){

console.error(
checkError
);

message.textContent =
"❌ " +
checkError.message;

watchlistButton.disabled =
false;

return;

}


if(existing){

message.textContent =
"❤️ Already in your watchlist.";

watchlistButton.textContent =
"❤️ In Watchlist";

return;

}


const {
error
} =
await supabaseClient
.from("watchlist")
.insert({

user_id:user.id,

anime_id:currentAnimeId

});


if(error){

console.error(error);

message.textContent =
"❌ " +
error.message;

watchlistButton.disabled =
false;

return;

}


message.textContent =
"❤️ Added to your watchlist!";

watchlistButton.textContent =
"❤️ In Watchlist";

}



/* =========================
   START
   ========================= */

loadWatchPage();

</script>


</body>

</html>

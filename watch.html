<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watch | J-AnimeX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.back{
color:white;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:1000px;
margin:auto;
padding:35px 6%;
}

.video-box{
background:#000;
border-radius:14px;
overflow:hidden;
}

video{
width:100%;
display:block;
max-height:600px;
background:#000;
}

h1{
margin-top:25px;
font-size:35px;
}

.episode-title{
color:#ff3b81;
font-size:18px;
margin:10px 0;
}

.description{
color:#aaa;
line-height:1.8;
}

.btn{
display:inline-block;
padding:12px 18px;
margin-top:15px;
margin-right:8px;
border:0;
border-radius:8px;
background:#ff3b81;
color:white;
text-decoration:none;
cursor:pointer;
font-weight:bold;
}

.secondary{
background:#242432;
}

.message{
margin-top:20px;
color:#aaa;
}

.error{
color:#ff6b81;
}

.loading{
color:#aaa;
padding:30px 0;
}

.note{
margin-top:25px;
padding:18px;
background:#15151f;
border-radius:10px;
color:#aaa;
line-height:1.6;
}

.episodes{
margin-top:35px;
}

.episodes h2{
margin-bottom:15px;
}

.episode-list{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.episode-btn{
background:#242432;
color:white;
border:0;
padding:10px 15px;
border-radius:7px;
cursor:pointer;
}

.episode-btn.active{
background:#ff3b81;
}

.hidden{
display:none;
}

@media(max-width:600px){

.container{
padding:25px 4%;
}

h1{
font-size:27px;
}

header{
padding:16px 4%;
}

.logo{
font-size:24px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="back"
href="index.html">

← Home

</a>

</header>

<main class="container">

<div
class="loading"
id="loading">

Loading episode...

</div>

<div
id="content"
class="hidden">

<div class="video-box">

<video
id="video"
controls
playsinline
preload="metadata">

Your browser does not support video playback.

</video>

</div>

<h1 id="title"></h1>

<div
class="episode-title"
id="episodeTitle">
</div>

<p
class="description"
id="description">
</p>

<a
class="btn secondary"
id="animeButton"
href="#">

← Anime Details

</a>

<button
class="btn"
id="watchlistButton">

❤️ Add to Watchlist

</button>

<div
class="message"
id="message">
</div>

<div class="episodes">

<h2>📺 Episodes</h2>

<div
class="episode-list"
id="episodeList">
</div>

</div>

<div class="note">

<strong>Important:</strong>

This player is intended only for
original, licensed, or legally
permitted video content.

</div>

</div>

</main>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   URL PARAMETERS
========================= */

const params =
new URLSearchParams(
window.location.search
);

/*
   Support multiple parameter names
*/

const animeId =
params.get("id") ||
params.get("anime_id") ||
params.get("animeId");

const episodeId =
params.get("episode") ||
params.get("episode_id") ||
params.get("episodeId");


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const content =
document.getElementById("content");

const video =
document.getElementById("video");

const title =
document.getElementById("title");

const episodeTitle =
document.getElementById("episodeTitle");

const description =
document.getElementById("description");

const animeButton =
document.getElementById("animeButton");

const message =
document.getElementById("message");

const episodeList =
document.getElementById("episodeList");

const watchlistButton =
document.getElementById("watchlistButton");


let currentAnimeId = null;
let currentEpisode = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, error=false){

message.textContent = text;

message.className =
error
? "message error"
: "message";

}


/* =========================
   LOAD ANIME
========================= */

async function loadWatchPage(){

try{

if(!animeId){

loading.innerHTML =
'<div class="error">❌ Anime ID नहीं मिला।</div>';

return;

}


/* Get anime */

const {
data: anime,
error: animeError
} =
await supabaseClient
.from("anime")
.select(`
id,
title,
description,
poster_url
`)
.eq("id", animeId)
.maybeSingle();


if(animeError){

console.error(
"Anime error:",
animeError
);

loading.innerHTML =
'<div class="error">❌ Anime load नहीं हो पाया।</div>';

return;

}


if(!anime){

loading.innerHTML =
'<div class="error">❌ Anime नहीं मिला।</div>';

return;

}


currentAnimeId =
anime.id;


title.textContent =
anime.title || "Anime";


description.textContent =
anime.description ||
"Information coming soon.";


animeButton.href =
"anime.html?id=" +
encodeURIComponent(anime.id);


/*
   Poster को video poster की तरह use करें
*/

if(anime.poster_url){

video.poster =
anime.poster_url;

}


/* Load episodes */

await loadEpisodes(anime);


/* Check watchlist */

await checkWatchlist();

}

catch(error){

console.error(error);

loading.innerHTML =
'<div class="error">❌ कुछ गलत हो गया। Console check करें।</div>';

}

}


/* =========================
   LOAD EPISODES
========================= */

async function loadEpisodes(anime){

const {
data: episodes,
error
} =
await supabaseClient
.from("episodes")
.select(`
id,
anime_id,
episode_number,
title,
video_url,
created_at
`)
.eq(
"anime_id",
anime.id
)
.order(
"episode_number",
{
ascending:true
}
);


if(error){

console.error(
"Episode error:",
error
);

loading.innerHTML =
'<div class="error">❌ Episodes load नहीं हो पाए।</div>';

return;

}


if(!episodes || episodes.length === 0){

loading.innerHTML =
'<div class="error">❌ इस Anime का कोई episode नहीं है।</div>';

return;

}


/* Render buttons */

renderEpisodes(episodes);


/*
   Requested episode find करें
*/

let selectedEpisode = null;

if(episodeId){

selectedEpisode =
episodes.find(
episode =>
String(episode.id) ===
String(episodeId)
);

}


/*
   अगर requested episode नहीं मिला
   तो पहला episode चलाएं
*/

if(!selectedEpisode){

selectedEpisode =
episodes[0];

}


/* Play */

playEpisode(selectedEpisode);


/* Show content */

loading.style.display = "none";

content.classList.remove("hidden");

}


/* =========================
   RENDER EPISODES
========================= */

function renderEpisodes(episodes){

episodeList.innerHTML = "";

episodes.forEach(
episode => {

const button =
document.createElement("button");

button.type = "button";

button.className =
"episode-btn";

button.textContent =
"Episode " +
episode.episode_number;

button.dataset.id =
episode.id;

button.addEventListener(
"click",
function(){

playEpisode(episode);

}
);

episodeList.appendChild(button);

});

}


/* =========================
   PLAY EPISODE
========================= */

function playEpisode(episode){

if(!episode){

showMessage(
"❌ Episode नहीं मिला।",
true
);

return;

}


currentEpisode =
episode;


/*
   Video URL check
*/

if(!episode.video_url){

video.removeAttribute("src");

video.load();

episodeTitle.textContent =
"Episode " +
episode.episode_number;

showMessage(
"❌ इस episode का video URL उपलब्ध नहीं है।",
true
);

return;

}


/*
   Set video
*/

video.pause();

video.src =
episode.video_url;

video.load();


episodeTitle.textContent =
"Episode " +
episode.episode_number +
(
episode.title
? " • " + episode.title
: ""
);


/*
   Active episode
*/

document
.querySelectorAll(".episode-btn")
.forEach(
button => {

button.classList.toggle(
"active",
String(button.dataset.id) ===
String(episode.id)
);

});


showMessage("");


/*
   URL update
*/

const newUrl =
"watch.html?id=" +
encodeURIComponent(currentAnimeId) +
"&episode=" +
encodeURIComponent(episode.id);

window.history.replaceState(
{},
"",
newUrl
);

}


/* =========================
   VIDEO ERROR
========================= */

video.addEventListener(
"error",
function(){

showMessage(
"❌ Video load नहीं हो पाया। Video URL direct playable होना चाहिए।",
true
);

console.error(
"Video error:",
video.error
);

}
);


/* =========================
   GET USER
========================= */

async function getCurrentUser(){

const {
data,
error
} =
await supabaseClient
.auth
.getUser();

if(error){

console.error(
"User error:",
error
);

return null;

}

return data.user || null;

}


/* =========================
   CHECK WATCHLIST
========================= */

async function checkWatchlist(){

if(!currentAnimeId){

return;

}

const user =
await getCurrentUser();

if(!user){

return;

}


const {
data,
error
} =
await supabaseClient
.from("watchlist")
.select("id")
.eq(
"user_id",
user.id
)
.eq(
"anime_id",
currentAnimeId
)
.maybeSingle();


if(error){

console.error(
"Watchlist check error:",
error
);

return;

}


if(data){

watchlistButton.textContent =
"❤️ In Watchlist";

}

}


/* =========================
   ADD WATCHLIST
========================= */

async function addWatchlist(){

if(!currentAnimeId){

showMessage(
"❌ Anime ID नहीं मिला।",
true
);

return;

}


const user =
await getCurrentUser();


if(!user){

showMessage(
"❌ पहले Login करें।",
true
);

setTimeout(
function(){

window.location.href =
"login.html";

},
800
);

return;

}


watchlistButton.disabled = true;


const {
data:existing,
error:checkError
} =
await supabaseClient
.from("watchlist")
.select("id")
.eq(
"user_id",
user.id
)
.eq(
"anime_id",
currentAnimeId
)
.maybeSingle();


if(checkError){

console.error(
"Watchlist check:",
checkError
);

showMessage(
"❌ " + checkError.message,
true
);

watchlistButton.disabled = false;

return;

}


if(existing){

showMessage(
"❤️ यह Anime पहले से Watchlist में है।"
);

watchlistButton.textContent =
"❤️ In Watchlist";

watchlistButton.disabled = false;

return;

}


/*
   Add
*/

const {
error
} =
await supabaseClient
.from("watchlist")
.insert({

user_id:user.id,

anime_id:currentAnimeId

});


if(error){

console.error(
"Watchlist insert:",
error
);

showMessage(
"❌ " + error.message,
true
);

watchlistButton.disabled = false;

return;

}


showMessage(
"❤️ Watchlist में add हो गया!"
);

watchlistButton.textContent =
"❤️ In Watchlist";

watchlistButton.disabled = false;

}


/* =========================
   BUTTON EVENT
========================= */

watchlistButton.addEventListener(
"click",
addWatchlist
);


/* =========================
   START
========================= */

loadWatchPage();

</script>

</body>

</html>

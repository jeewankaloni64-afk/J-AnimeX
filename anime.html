<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Anime Details | J-AnimeX</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:white;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:1000px;
margin:auto;
padding:45px 6%;
}

.poster{
height:380px;
background:#242432;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
margin-bottom:30px;
}

h1{
font-size:45px;
margin-bottom:12px;
}

.rating{
color:#ffd166;
font-size:20px;
margin:10px 0;
}

.genre{
color:#ff3b81;
margin:15px 0;
}

.description{
color:#bbb;
line-height:1.8;
font-size:16px;
}

.buttons{
margin-top:25px;
}

.btn{
display:inline-block;
padding:13px 20px;
background:#ff3b81;
color:white;
text-decoration:none;
border:0;
border-radius:8px;
margin-right:8px;
cursor:pointer;
font-weight:bold;
}

.secondary{
background:#242432;
}

.info{
margin-top:35px;
padding:25px;
background:#15151f;
border-radius:12px;
}

.info p{
color:#bbb;
margin:12px 0;
}

.message{
margin-top:20px;
color:#aaa;
}

@media(max-width:600px){

.poster{
height:280px;
}

h1{
font-size:35px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="home"
href="index.html">
← Home
</a>

</header>


<main class="container">


<div
class="poster"
id="poster">

🎬

</div>


<h1 id="title">
Loading...
</h1>


<div
class="rating"
id="rating">
</div>


<div
class="genre"
id="genre">
</div>


<p
class="description"
id="description">
</p>


<div class="buttons">

<button
class="btn"
onclick="addWatchlist()">
❤️ Add to Watchlist
</button>


<a
class="btn"
id="watchButton"
href="#">
▶ Watch
</a>


</div>


<div
class="message"
id="message">
</div>


<div class="info">

<h2>
📖 Anime Information
</h2>

<p id="year"></p>

<p id="status"></p>

<p id="episodes"></p>

</div>


</main>


<script>


const params =
new URLSearchParams(
window.location.search
);


const anime =
params.get("anime");


const data = {


"Naruto":{

rating:"⭐ 8.8 / 10",

genre:
"Action • Adventure",

description:
"Naruto is an anime adventure about ninjas, friendship, determination and an unforgettable journey.",

year:"2002",

status:"Completed",

episodes:"220"

},


"One Piece":{

rating:"⭐ 9.0 / 10",

genre:
"Adventure • Fantasy",

description:
"One Piece follows a pirate crew on an adventure across the seas in search of a legendary treasure.",

year:"1999",

status:"Ongoing",

episodes:"1000+"

},


"Demon Slayer":{

rating:"⭐ 8.6 / 10",

genre:
"Action • Fantasy",

description:
"Demon Slayer follows a young swordsman on a dangerous journey involving demons, family and courage.",

year:"2019",

status:"Ongoing",

episodes:"Multiple seasons"

},


"Jujutsu Kaisen":{

rating:"⭐ 8.5 / 10",

genre:
"Action • Supernatural",

description:
"Jujutsu Kaisen is a supernatural action series involving cursed energy and powerful battles.",

year:"2020",

status:"Ongoing",

episodes:"Multiple seasons"

}

};


const info =
data[anime] || {

rating:"⭐ New",

genre:"Anime",

description:
"Information coming soon.",

year:"2026",

status:"Coming Soon",

episodes:"Coming Soon"

};


document.getElementById(
"title"
).textContent =
anime || "Anime";


document.getElementById(
"rating"
).textContent =
info.rating;


document.getElementById(
"genre"
).textContent =
info.genre;


document.getElementById(
"description"
).textContent =
info.description;


document.getElementById(
"year"
).textContent =
"📅 Year: " + info.year;


document.getElementById(
"status"
).textContent =
"📌 Status: " + info.status;


document.getElementById(
"episodes"
).textContent =
"🎬 Episodes: " + info.episodes;



/*
Connect the Watch button
to the watch page.
*/

document.getElementById(
"watchButton"
).href =
"watch.html?anime=" +
encodeURIComponent(anime);



function addWatchlist(){

if(!anime){

return;

}

localStorage.setItem(
"JAnimeX_Watchlist",
anime
);

document.getElementById(
"message"
).textContent =
"❤️ " + anime +
" added to your watchlist!";

}

</script>


</body>

</html>

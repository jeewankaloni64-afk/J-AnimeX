<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:18px 6%;
background:#11111a;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.home{
color:white;
text-decoration:none;
background:#242432;
padding:10px 15px;
border-radius:8px;
}

.container{
max-width:1000px;
margin:auto;
padding:45px 6%;
}

.poster{
width:100%;
max-width:350px;
height:480px;
object-fit:cover;
background:#242432;
border-radius:16px;
display:block;
margin-bottom:30px;
}

h1{
font-size:45px;
margin-bottom:12px;
}

.rating{
color:#ffd166;
font-size:20px;
margin:10px 0;
}

.genre{
color:#ff3b81;
margin:15px 0;
}

.description{
color:#bbb;
line-height:1.8;
font-size:16px;
}

.buttons{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.btn{
display:inline-block;
padding:13px 20px;
background:#ff3b81;
color:white;
text-decoration:none;
border:0;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.secondary{
background:#242432;
}

.info{
margin-top:35px;
padding:25px;
background:#15151f;
border-radius:12px;
}

.info p{
color:#bbb;
margin:12px 0;
}

.message{
margin-top:20px;
color:#aaa;
}

.error{
color:#ff6b81;
}

.loading{
color:#aaa;
}

.episode-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
}

.episode-btn{
display:inline-block;
padding:11px 16px;
background:#242432;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.episode-btn:hover{
background:#ff3b81;
}

.empty{
color:#aaa;
}

small{
font-size:13px;
}

@media(max-width:600px){

.container{
padding:30px 5%;
}

.poster{
height:380px;
}

font-size:35px;
}

header{
padding:16px 5%;
}

.logo{
font-size:24px;
}

}

<body>

<header>

<div class="logo">
J-<span>AnimeX</span>
</div>

<a
class="home"
href="index.html">

← Home

</a>

</header>


<main class="container">


<img
class="poster"
id="poster"
src=""
alt="Anime Poster"
style="display:none;"
>


<div
class="loading"
id="loading">

Loading anime...

</div>


<div
id="content"
style="display:none;"
>


<h1 id="title"></h1>


<div
class="rating"
id="rating">
</div>


<div
class="genre"
id="genre">
</div>


<p
class="description"
id="description">
</p>


<div class="buttons">


<button
class="btn"
id="watchlistButton">

❤️ Add to Watchlist

</button>


<a
class="btn secondary"
id="watchButton"
href="#">

▶ Watch

</a>


</div>


<div
class="message"
id="message">
</div>


<div class="info">

<h2>
📖 Anime Information
</h2>

<p id="year"></p>

<p id="status"></p>

<p id="episodes">
🎬 Episodes: Loading...
</p>

</div>


<div class="info">

<h2>
📺 Episodes
</h2>


<div
class="episode-list"
id="episodeList">

</div>

</div>


</div>

</main>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oytrcupsefiwtasoqaik.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable__2ItjvEKIYpg7w8iX2-Qzw_siS9P-Ba";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
window.location.search
);

const animeId =
params.get("id");


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const content =
document.getElementById("content");

const poster =
document.getElementById("poster");

const title =
document.getElementById("title");

const rating =
document.getElementById("rating");

const genre =
document.getElementById("genre");

const description =
document.getElementById("description");

const year =
document.getElementById("year");

const status =
document.getElementById("status");

const episodes =
document.getElementById("episodes");

const watchButton =
document.getElementById("watchButton");

const message =
document.getElementById("message");

const watchlistButton =
document.getElementById("watchlistButton");

const episodeList =
document.getElementById("episodeList");


/* =========================
   GET CURRENT USER
========================= */

async function getCurrentUser(){

try{

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error){

console.error(error);

return null;

}

return data.user || null;

}

catch(error){

console.error(error);

return null;

}

}


/* =========================
   LOAD ANIME
========================= */

async function loadAnime(){

if(!animeId){

loading.innerHTML =
'<div class="error">❌ Anime ID नहीं मिला.</div>';

return;

}


try{


/* =========================
   GET ANIME
========================= */

const {
data,
error
} =
await supabaseClient
.from("anime")
.select("*")
.eq(
"id",
animeId
)
.maybeSingle();


if(error){

console.error(
"Anime error:",
error
);

loading.innerHTML =
'<div class="error">' +
'❌ Anime load नहीं हो पाया.<br>' +
'<small>' +
error.message +
'</small>' +
'</div>';

return;

}


if(!data){

loading.innerHTML =
'<div class="error">' +
'❌ Anime नहीं मिला.' +
'</div>';

return;

}


/* =========================
   TITLE
========================= */

title.textContent =
data.title ||
data.name ||
"Untitled";


/* =========================
   RATING
========================= */

if(
data.rating !== undefined &&
data.rating !== null
){

rating.textContent =
"⭐ " + data.rating;

}
else{

rating.textContent =
"⭐ N/A";

}


/* =========================
   GENRE
========================= */

genre.textContent =
data.genre ||
data.genres ||
"";


/* =========================
   DESCRIPTION
========================= */

description.textContent =
data.description ||
data.summary ||
"Information coming soon.";


/* =========================
   YEAR
========================= */

if(
data.release_year !== undefined &&
data.release_year !== null
){

year.textContent =
"📅 Year: " +
data.release_year;

}
else if(
data.year !== undefined &&
data.year !== null
){

year.textContent =
"📅 Year: " +
data.year;

}
else{

year.textContent =
"";

}


/* =========================
   STATUS
========================= */

if(
data.status !== undefined &&
data.status !== null
){

status.textContent =
"📌 Status: " +
data.status;

}
else{

status.textContent =
"";

}


/* =========================
   POSTER
========================= */

const posterUrl =
data.poster_url ||
data.poster ||
data.image_url ||
"";


if(posterUrl){

poster.src =
posterUrl;

poster.alt =
data.title ||
data.name ||
"Anime";

poster.style.display =
"block";

}


/* =========================
   WATCH BUTTON
========================= */

watchButton.href =
"watch.html?id=" +
encodeURIComponent(
data.id
);


/* =========================
   SHOW CONTENT
========================= */

loading.style.display =
"none";

content.style.display =
"block";


/* =========================
   LOAD EPISODES
========================= */

await loadEpisodes(
data.id
);


/* =========================
   WATCHLIST
========================= */

await checkWatchlist();

}

catch(error){

console.error(
"Unexpected error:",
error
);

loading.innerHTML =
'<div class="error">' +
'❌ Anime load नहीं हो पाया.<br>' +
'<small>' +
error.message +
'</small>' +
'</div>';

}

}


/* =========================
   LOAD EPISODES
========================= */

async function loadEpisodes(
animeId
){

const {
data,
error
} =
await supabaseClient
.from("episodes")
.select(`
id,
anime_id,
episode_number,
title,
video_url,
created_at
`)
.eq(
"anime_id",
animeId
)
.order(
"episode_number",
{
ascending:true
}
);


if(error){

console.error(
"Episode error:",
error
);

episodes.textContent =
"🎬 Episodes: Error";

episodeList.innerHTML =
'<div class="error">' +
'❌ Episodes load नहीं हो पाए.<br>' +
'<small>' +
error.message +
'</small>' +
'</div>';

return;

}


/* =========================
   NO EPISODES
========================= */

if(
!data ||
data.length === 0
){

episodes.textContent =
"🎬 Episodes: 0";

episodeList.innerHTML =
'<div class="empty">' +
'इस Anime का अभी कोई episode नहीं है.' +
'</div>';

return;

}


/* =========================
   EPISODE COUNT
========================= */

episodes.textContent =
"🎬 Episodes: " +
data.length;


episodeList.innerHTML =
"";


/* =========================
   EPISODE BUTTONS
========================= */

data.forEach(
episode => {

const button =
document.createElement("a");


button.className =
"episode-btn";


button.textContent =
"Episode " +
episode.episode_number;


button.href =
"watch.html?id=" +
encodeURIComponent(animeId) +
"&episode=" +
encodeURIComponent(episode.id);


if(episode.title){

button.title =
episode.title;

}


episodeList.appendChild(
button
);

});

}


/* =========================
   ADD WATCHLIST
========================= */

async function addWatchlist(){

if(!animeId){

return;

}


const user =
await getCurrentUser();


if(!user){

message.textContent =
"❌ पहले Login करें.";

setTimeout(
function(){

window.location.href =
"login.html";

},
1000
);

return;

}


watchlistButton.disabled =
true;

message.textContent =
"Adding to watchlist...";


const {
data:existing,
error:checkError
} =
await supabaseClient
.from("watchlist")
.select("id")
.eq(
"user_id",
user.id
)
.eq(
"anime_id",
animeId
)
.maybeSingle();


if(checkError){

console.error(
checkError
);

message.textContent =
"❌ " +
checkError.message;

watchlistButton.disabled =
false;

return;

}


if(existing){

message.textContent =
"❤️ Already in your watchlist.";

watchlistButton.textContent =
"❤️ In Watchlist";

watchlistButton.disabled =
true;

return;

}


/* =========================
   INSERT
========================= */

const {
error
} =
await supabaseClient
.from("watchlist")
.insert({

user_id:user.id,

anime_id:animeId

});


if(error){

console.error(
error
);

message.textContent =
"❌ " +
error.message;

watchlistButton.disabled =
false;

return;

}


message.textContent =
"❤️ Added to your watchlist!";

watchlistButton.textContent =
"❤️ In Watchlist";

watchlistButton.disabled =
true;

}


/* =========================
   CHECK WATCHLIST
========================= */

async function checkWatchlist(){

if(!animeId){

return;

}


const user =
await getCurrentUser();


if(!user){

return;

}


const {
data,
error
} =
await supabaseClient
.from("watchlist")
.select("id")
.eq(
"user_id",
user.id
)
.eq(
"anime_id",
animeId
)
.maybeSingle();


if(error){

console.error(
error
);

return;

}


if(data){

watchlistButton.textContent =
"❤️ In Watchlist";

watchlistButton.disabled =
true;

}

}


/* =========================
   WATCHLIST BUTTON
========================= */

watchlistButton.addEventListener(
"click",
addWatchlist
);


/* =========================
   START
========================= */

loadAnime();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J-AnimeX Anime Details</title>

<style>
body{
margin:0;
background:#09090f;
color:white;
font-family:Arial,sans-serif;
}

header{
padding:20px 6%;
background:#11111a;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#ff3b81;
}

.container{
max-width:1000px;
margin:auto;
padding:50px 6%;
}

.poster{
height:350px;
background:#242432;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
margin-bottom:30px;
}

h1{
font-size:45px;
}

.rating{
color:#ffd166;
font-size:20px;
}

.genre{
color:#ff3b81;
margin:15px 0;
}

.description{
color:#bbb;
line-height:1.8;
}

.info{
margin-top:30px;
padding:25px;
background:#15151f;
border-radius:12px;
}

.info p{
color:#bbb;
}

.btn{
display:inline-block;
padding:13px 20px;
background:#ff3b81;
color:white;
text-decoration:none;
border-radius:8px;
margin-top:15px;
margin-right:8px;
border:0;
cursor:pointer;
}

.back{
background:#242432;
}
</style>
</head>

<body>

<header>
<div class="logo">
J-<span>AnimeX</span>
</div>
</header>

<div class="container">

<div class="poster" id="poster">
🎬
</div>

<h1 id="title">Loading...</h1>

<div class="rating" id="rating"></div>

<div class="genre" id="genre"></div>

<p class="description" id="description"></p>

<button class="btn" onclick="addWatchlist()">
❤️ Add to Watchlist
</button>

<a class="btn back" href="index.html">
← Home
</a>

<div class="info">

<h2>Anime Information</h2>

<p id="year"></p>
<p id="status"></p>
<p id="episodes"></p>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const anime =
params.get("anime");

const data = {

"Naruto":{
rating:"⭐ 8.8 / 10",
genre:"Action • Adventure",
description:"Naruto is a fictional anime series about ninjas, friendship, determination and adventure.",
year:"2002",
status:"Completed",
episodes:"220"
},

"One Piece":{
rating:"⭐ 9.0 / 10",
genre:"Adventure • Fantasy",
description:"One Piece is a fictional pirate adventure series featuring a long journey across the seas.",
year:"1999",
status:"Ongoing",
episodes:"1000+"
},

"Demon Slayer":{
rating:"⭐ 8.6 / 10",
genre:"Action • Fantasy",
description:"Demon Slayer is a fictional fantasy adventure about a young swordsman and his journey.",
year:"2019",
status:"Ongoing",
episodes:"Multiple seasons"
},

"Jujutsu Kaisen":{
rating:"⭐ 8.5 / 10",
genre:"Action • Supernatural",
description:"Jujutsu Kaisen is a fictional supernatural action series involving cursed energy and battles.",
year:"2020",
status:"Ongoing",
episodes:"Multiple seasons"
}

};

const info =
data[anime] || {
rating:"⭐ New",
genre:"Anime",
description:"Information coming soon.",
year:"2026",
status:"Coming Soon",
episodes:"Coming Soon"
};

document.getElementById("title").textContent =
anime || "Anime";

document.getElementById("rating").textContent =
info.rating;

document.getElementById("genre").textContent =
info.genre;

document.getElementById("description").textContent =
info.description;

document.getElementById("year").textContent =
"Year: " + info.year;

document.getElementById("status").textContent =
"Status: " + info.status;

document.getElementById("episodes").textContent =
"Episodes: " + info.episodes;


function addWatchlist(){

localStorage.setItem(
"JAnimeX_Watchlist",
anime
);

alert(
(anime || "Anime") +
" added to your watchlist ❤️"
);

}

</script>

</body>
</html>
